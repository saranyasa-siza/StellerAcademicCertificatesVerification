name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban-hello-world/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('soroban-hello-world/Cargo.lock') }}

      - name: Run contract tests
        working-directory: soroban-hello-world
        run: cargo test --package hello-world

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_CONTRACT_ID: CBZRJZYNDXYTRY2CVNLUQXG5NE2PHY6GNMBKBXBRX6HRVNXBU5D7IJXA
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_NETWORK: testnet
